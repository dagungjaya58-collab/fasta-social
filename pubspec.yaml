name: fasta_social
description: FASTA Social - chat, short video, profile and media sharing.
publish_to: "none"
version: 1.5.0+15
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  image_picker: ^1.2.0
  video_player: ^2.10.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
