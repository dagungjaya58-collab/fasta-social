name: Build FASTA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FASTA
        run: |
          unzip -o fasta_social_v10_complete.zip
          cd fasta_social_v10
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --org com.fasta .
          mkdir -p android/app
          cp -f android/app/google-services.json android/app/google-services.json 2>/dev/null || true

      - name: Install packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FASTA-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
